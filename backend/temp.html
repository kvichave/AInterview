<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speaking Indicator</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <!-- User Card - Idle State -->
    <div
      class="relative p-4 w-60 h-40 rounded-lg shadow-lg border-2 border-gray-300 bg-white transition"
    >
      <!-- Speaking Indicator -->
      <div class="absolute top-2 left-2 flex items-center space-x-2">
        <div class="w-3 h-3 rounded-full bg-gray-300"></div>
        <p class="text-sm font-medium text-gray-600">Idle</p>
      </div>
      <!-- User Info -->
      <div class="flex flex-col items-center justify-center h-full">
        <div
          class="w-16 h-16 rounded-full bg-gray-200 border-4 border-gray-300"
        ></div>
        <h3 class="text-lg font-semibold text-gray-800 mt-4">John Doe</h3>
      </div>
      <!-- Toggle Button -->
      <button
        class="absolute bottom-2 right-2 px-3 py-1 bg-blue-500 text-white text-sm rounded-md hover:bg-blue-600 transition"
      >
        Toggle
      </button>
    </div>

    <!-- User Card - Speaking State -->
    <div
      class="relative p-4 w-60 h-40 rounded-lg shadow-lg border-2 border-green-500 bg-white animate-pulse transition"
    >
      <!-- Speaking Indicator -->
      <div class="absolute top-2 left-2 flex items-center space-x-2">
        <div class="w-3 h-3 rounded-full bg-green-500 animate-ping"></div>
        <p class="text-sm font-medium text-green-600">Speaking</p>
      </div>
      <!-- User Info -->
      <div class="flex flex-col items-center justify-center h-full">
        <div
          class="w-16 h-16 rounded-full bg-gray-200 border-4 border-green-500"
        ></div>
        <h3 class="text-lg font-semibold text-gray-800 mt-4">Jane Smith</h3>
      </div>
      <!-- Toggle Button -->
      <button
        class="absolute bottom-2 right-2 px-3 py-1 bg-blue-500 text-white text-sm rounded-md hover:bg-blue-600 transition"
      >
        Toggle
      </button>
    </div>
  </body>
</html>
